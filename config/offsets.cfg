# ============================================================
#  PB CHEAT - PEYXDEV
#  Hanya 2 fitur: Crosshair + NameTag ESP
# ============================================================

[general]
client_module    = PointBlank.exe
menu_toggle_key  = 0x2D   # INSERT: buka / minimize menu
exit_key         = 0x23   # END: unload cheat
menu_x           = 228
menu_y           = 8

[features]
draw_name        = 1      # NameTag ESP (nama musuh tembus dinding, patch AOB)

# Fast reload (makro nyata, tanpa offset): F6 = R -> 3 -> 1
fast_reload      = 1
fast_reload_key  = 0x75   # F6
reload_key       = 0x52   # R
reload_slot_a    = 0x33   # 3
reload_slot_b    = 0x31   # 1
reload_hold_ms   = 35
reload_gap_ms    = 110

[crosshair]
draw_crosshair   = 1
crosshair_size   = 12     # 8 kecil / 12 sedang / 16 / 20 besar
crosshair_r      = 60
crosshair_g      = 220
crosshair_b      = 80
crosshair_thickness = 1
